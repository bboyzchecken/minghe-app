# Deploy API → AWS Lightsail (api.minghe.work)
#
# ขั้นตอน: build image → push GHCR (ghcr.io/<owner>/minghe-api:<sha>, :latest)
#          → ssh เข้า Lightsail → docker compose pull + up (zero-config: ไฟล์ compose/Caddyfile ส่งไปด้วยทุกครั้ง)
#
# กติกา production เหมือน deploy-web.yml: push เข้า main เท่านั้น + environment `production`
#
# Secrets ที่ต้องตั้งใน environment production:
#   LIGHTSAIL_HOST     IP หรือโดเมนของเครื่อง (เช่น api.minghe.work)
#   LIGHTSAIL_USER     ผู้ใช้ ssh (Ubuntu image = ubuntu)
#   LIGHTSAIL_SSH_KEY  private key (PEM) ที่ Lightsail ให้ดาวน์โหลด
#   GHCR_PULL_TOKEN    (เฉพาะกรณี package เป็น private) PAT read:packages สำหรับให้เครื่อง pull image
name: Deploy API (Lightsail)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'deploy/lightsail/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/minghe-api

jobs:
  build-push:
    name: build + push image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: deploy to Lightsail
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.minghe.work/healthz
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + Caddyfile to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: 'deploy/lightsail/docker-compose.yml,deploy/lightsail/Caddyfile'
          target: /opt/minghe
          strip_components: 2

      - name: Pull + restart api
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.tag }}
          IMAGE: ${{ env.IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE,GHCR_USER,GHCR_PULL_TOKEN
          script: |
            set -e
            cd /opt/minghe
            test -f .env || { echo "ยังไม่มี /opt/minghe/.env — รัน deploy/lightsail/setup.sh ก่อน"; exit 1; }
            if [ -n "$GHCR_PULL_TOKEN" ]; then
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            # ตรึง tag ที่ deploy ไว้ใน .env เพื่อให้ `docker compose up` ครั้งถัดไปได้เวอร์ชันเดิม (และ rollback ได้ด้วยการแก้บรรทัดนี้)
            grep -q '^MINGHE_API_IMAGE=' .env && sed -i "s#^MINGHE_API_IMAGE=.*#MINGHE_API_IMAGE=${IMAGE}:${IMAGE_TAG}#" .env || echo "MINGHE_API_IMAGE=${IMAGE}:${IMAGE_TAG}" >> .env
            docker compose pull api
            docker compose up -d --remove-orphans
            # รอจน healthcheck ผ่าน (entrypoint รัน migrate + seed ก่อน)
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' minghe-api-1 2>/dev/null || echo starting)
              [ "$status" = "healthy" ] && break
              sleep 5
            done
            docker compose ps
            curl -fsS http://127.0.0.1:5000/healthz
            docker image prune -f >/dev/null
