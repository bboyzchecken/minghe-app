# Deploy หน้าบ้าน → Cloudflare Pages (minghe.work)
#
# กติกา production:
#   · trigger เฉพาะ push เข้า main (หรือกดรันเองจาก main) — ไม่มีทางอื่น
#   · ใช้ environment `production` ซึ่งตั้ง Deployment branches = main only (+ required reviewer ถ้าต้องการ)
#   · main เองถูกป้องกันด้วย ruleset ให้ต้องผ่าน PR + CI ก่อน (ดู docs/deploy.md)
#
# Secrets/Vars ที่ต้องตั้งใน environment production:
#   CLOUDFLARE_API_TOKEN  (secret)  token ที่มีสิทธิ์ Cloudflare Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID (secret)
#   API_BASE_URL          (var)     ค่าเริ่มต้น https://api.minghe.work
#   CF_PAGES_PROJECT      (var)     ค่าเริ่มต้น minghe-work
name: Deploy web (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: build + deploy
    # กันคนกด workflow_dispatch จาก branch อื่น
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://minghe.work
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build static export (live)
        env:
          MINGHE_MODE: live
          MINGHE_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.minghe.work' }}
          MINGHE_GOOGLE_LOGIN_ENABLED: ${{ vars.GOOGLE_LOGIN_ENABLED || 'false' }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter @minghe/app build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/app/out
            --project-name=${{ vars.CF_PAGES_PROJECT || 'minghe-work' }}
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-message="${{ github.event.head_commit.message || 'manual deploy' }}"
